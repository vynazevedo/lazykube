name: Build release
on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - run: go mod download

      - name: Current tag
        run: echo "${{ github.ref_name }}"

      - name: Install goxz
        run: go install github.com/Songmu/goxz/cmd/goxz@v0.12.0

      - name: Cross build
        env:
          CGO_ENABLED: "0"
          LDFLAGS: "-s -w -X github.com/vynazevedo/lazykube/internal/ui.Version=${{ github.ref_name }}"
        run: |
          goxz -n lazykube -pv "${{ github.ref_name }}" -os darwin,linux,windows -arch amd64,arm64 -d dist -build-ldflags "$LDFLAGS" ./cmd/lazykube
          goxz -n lazykube -pv "${{ github.ref_name }}" -os linux -arch 386,arm -d dist -build-ldflags "$LDFLAGS" ./cmd/lazykube

      - uses: softprops/action-gh-release@v3
        with:
          files: './dist/*'
        if: startsWith(github.ref, 'refs/tags/')

      - uses: izumin5210/action-homebrew-tap@v1.0.0
        with:
          tap: TNK-Studio/homebrew-tools
          token: ${{ secrets.GITHUB_TOKEN }}
          tap-token: ${{ secrets.TAP_GITHUB_TOKEN }}
        if: startsWith(github.ref, 'refs/tags/')
