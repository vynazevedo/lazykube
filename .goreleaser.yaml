version: 2
project_name: lazykube

builds:
  - id: lazykube
    main: ./cmd/lazykube
    binary: lazykube
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/vynazevedo/lazykube/internal/ui.Version={{ if .IsSnapshot }}{{ .Version }}{{ else }}{{ .Tag }}{{ end }}

archives:
  - formats: [tar.gz]
    name_template: 'lazykube_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - NOTICE

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: '{{ .Version }}-next'

changelog:
  sort: asc
  groups:
    - title: Funcionalidades
      regexp: '^feat(\([^)]*\))?!?:'
      order: 0
    - title: Correções
      regexp: '^fix(\([^)]*\))?!?:'
      order: 1
    - title: Desempenho
      regexp: '^perf(\([^)]*\))?!?:'
      order: 2
    - title: Documentação
      regexp: '^docs(\([^)]*\))?!?:'
      order: 3
    - title: Manutenção e testes
      regexp: '^(build|chore|ci|refactor|style|test)(\([^)]*\))?!?:'
      order: 4
    - title: Outras mudanças
      order: 5

sboms:
  - artifacts: archive

release:
  draft: true
  github:
    owner: vynazevedo
    name: lazykube
  prerelease: auto
