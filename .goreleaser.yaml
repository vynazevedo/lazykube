version: 2
project_name: lazykube

before:
  hooks:
    - go mod download
    - sh -c 'mkdir -p completions manpages'
    - sh -c 'go run ./cmd/lazykube completion bash > completions/lazykube.bash'
    - sh -c 'go run ./cmd/lazykube completion zsh > completions/_lazykube'
    - sh -c 'go run ./cmd/lazykube completion fish > completions/lazykube.fish'
    - sh -c 'go run ./cmd/lazykube completion powershell > completions/lazykube.ps1'
    - sh -c 'set -eu; rm -f manpages/lazykube.1.gz; SOURCE_DATE_EPOCH={{ .CommitTimestamp }} go run ./cmd/lazykube man > manpages/lazykube.1.tmp && test -s manpages/lazykube.1.tmp && gzip -9 -n -c manpages/lazykube.1.tmp > manpages/lazykube.1.gz && rm manpages/lazykube.1.tmp'

builds:
  - id: lazykube
    main: ./cmd/lazykube
    binary: lazykube
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/vynazevedo/lazykube/internal/ui.Version={{ if .IsSnapshot }}{{ .Version }}{{ else }}{{ .Tag }}{{ end }} -X main.commit={{ .FullCommit }}

archives:
  - formats: [tar.gz]
    name_template: 'lazykube_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - NOTICE
      - completions/*
      - manpages/*

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: '{{ .Version }}-next'

changelog:
  sort: asc
  groups:
    - title: Funcionalidades
      regexp: '^feat(\([^)]*\))?!?:'
      order: 0
    - title: Correções
      regexp: '^fix(\([^)]*\))?!?:'
      order: 1
    - title: Desempenho
      regexp: '^perf(\([^)]*\))?!?:'
      order: 2
    - title: Documentação
      regexp: '^docs(\([^)]*\))?!?:'
      order: 3
    - title: Manutenção e testes
      regexp: '^(build|chore|ci|refactor|style|test)(\([^)]*\))?!?:'
      order: 4
    - title: Outras mudanças
      order: 5

sboms:
  - artifacts: archive

release:
  draft: true
  github:
    owner: vynazevedo
    name: lazykube
  prerelease: auto
